name: low-k-test1
model_type: mics_lmc
max_runs: 32
panel_cols: 4
build_panel: true
fields:
- key: num_epochs
  kind: int
  enabled: false
  mode: range
  from: '30'
  to: '50'
  step: '10'
- key: num_samples
  kind: int
  enabled: true
  mode: range
  from: '5000'
  to: '10000'
  step: '5000'
- key: number_of_points
  kind: int
  enabled: true
  mode: range
  from: '1000'
  to: '5000'
  step: '4000'
- key: num_layers
  kind: int
  enabled: true
  mode: range
  from: '2'
  to: '6'
  step: '2'
- key: clusters
  kind: str
  enabled: true
  mode: list
  values: 4-8-16,8-16-32,4-16-64,16-32-64
- key: pixel_sampling
  kind: str
  enabled: false
  mode: list
  values: superpixel
- key: pca_fit_step
  kind: int
  enabled: false
  mode: range
  from: '16'
  to: '32'
  step: '4'
- key: cluster_on_pca
  kind: bool
  enabled: true
  mode: list
  values: False, True
- key: cluster_pca_dims
  kind: int
  enabled: false
  mode: range
  from: '64'
  to: '64'
  step: '22'
- key: beta
  kind: float
  enabled: true
  mode: range
  from: '1'
  to: '11'
  step: '5'
- key: batch_size
  kind: int
  enabled: false
  mode: range
  from: '1024'
  to: ''
  step: '1'
- key: lr
  kind: float
  enabled: false
  mode: range
  from: '1'
  to: '1.0'
  step: '0.3'
- key: factor
  kind: float
  enabled: false
  mode: range
  from: '1'
  to: '2'
  step: '0.5'
