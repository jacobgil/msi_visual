# Fast / low-resource preset for interactive annotation.

mode: train

data:
  input_path: "E:\\MSImaging-data\\_msi_visual\\Extractions\\"
  transpose: false

model:
  model_type: mics_lmc
  sampling: coreset
  number_of_points: 200
  num_epochs: 20
  number_of_components: 3
  num_layers: 2
  lab_to_rgb: true
  cluster: true
  clusters: 4-8
  cluster_on_pca: true
  cluster_pca_dims: 20
  num_samples: 1000
  pca_fit_step: 32
  beta: 1.0
  k_epoch: 20
  temperature: 100.0
  lr: 1.0
  batch_size: 2048
  warmup_epochs: 5
  factor: 1
  random_state: 42
  verbose: false
  cluster_loss_weight: 1.0
  category_loss_weight: 0.0
  pixel_sampling: superpixel
  umap_n_neighbors: 30
  umap_n_training_epochs: 1
  umap_n_epochs: 1
  simple_k: 5
  nmf_3d_max_iter: 100
  nmf_3d_n_components: 3
  top3_low: 99.9
  top3_norm_percentile: 99.9
  nmf_segmentation_max_iter: 500
  umap_np_min_dist: 0.5
  umap_np_n_neighbors: 50
  umap_np_metric: euclidean

inference:
  model_path: null
  inference_folder: null
