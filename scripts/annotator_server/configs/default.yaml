# Default annotator-server config (plain YAML / OmegaConf — no Hydra).
# Edit or duplicate files in this folder; the UI lists only these configs.

mode: train

data:
  input_path: "E:\\MSImaging-data\\_msi_visual\\Extractions\\"
  transpose: false

model:
  # mics_lmc | parametric_umap | top3 | percentile_ratio | nmf_3d |
  # kmeans_segmentation | nmf_segmentation | nonparametric_umap
  model_type: mics_lmc

  # Classical msi_visual knobs (when model_type is one of those methods)
  simple_k: 8
  nmf_3d_max_iter: 200
  nmf_3d_n_components: 3
  top3_low: 99.9
  top3_norm_percentile: 99.9
  nmf_segmentation_max_iter: 2000
  umap_np_min_dist: 0.5
  umap_np_n_neighbors: 100
  umap_np_metric: euclidean

  # MiCS+LMC / shared training knobs
  sampling: coreset
  number_of_points: 500
  num_epochs: 30
  number_of_components: 3
  num_layers: 3
  lab_to_rgb: true
  cluster: true
  clusters: 4-8
  cluster_on_pca: false
  cluster_pca_dims: 64
  num_samples: 1000
  pca_fit_step: 16
  beta: 1.0
  k_epoch: 20
  temperature: 100.0
  lr: 1.0
  batch_size: 1024
  warmup_epochs: 10
  factor: 1
  random_state: 42
  verbose: false
  cluster_loss_weight: 1.0
  category_loss_weight: 0.0
  pixel_sampling: random

  # Parametric UMAP (when model_type: parametric_umap)
  umap_n_neighbors: 50
  umap_n_training_epochs: 2
  umap_n_epochs: 2

inference:
  model_path: null
  inference_folder: null
