# =============================================================================
# study_mics_clusters_sampling — multi-image OFAT + hill
# =============================================================================
# Swept axes (search_space):
#   cluster_ladder, pixel_sampling, temperature
#   cluster_features: raw | pca_8 | pca_32 | pca_512  (pca_* sets cluster_on_pca + dims)
#   beta, num_layers (1–3), factor (MLP width = int(2048 * factor); default factor=1 → 2048)
#   num_samples (5000 | 20000), k_epoch (1 | 20 | 50) — MiCS epochs per cluster level
#
# cluster_ladder: manual:<k-k-...> | silhouette:<tpl>
#
# Post-run silhouette analysis (bayes_mics_trials.csv):
#   - Filter cluster_ladder starting with silhouette:
#   - clusters_auto_tune_base_k_mean_over_images = mean silhouette k₀ over slices
#   - cluster_outcome_by_image_json = per-slice k₀ + effective ladder (8-16-32-...)
#   Compare vs manual:* trials and scatter k₀ vs continuous_dice / composite score.
# =============================================================================

defaults:
  - _self_

hydra:
  run:
    dir: outputs/study_mics_clusters_sampling/${now:%Y-%m-%d}/${now:%H-%M-%S}

input:
  npy_paths:
    - E:/MSImaging-data/_msi_visual/Extractions/Metaspace_datasets/Dataset5_spinalcord/5bins/0.npy
    - E:/MSImaging-data/_msi_visual/Extractions/Metaspace_datasets/Dataset4_kidney/5bins/0.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4506-5um/Intelli-slide/5_bins/0.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4558_5um/5bins/2/0.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4485-s2/5_bins/0.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4485-s2/5_bins/1.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4485-s2/5_bins/2.npy
    - E:/MSImaging-data/_msi_visual/Extractions/NRL4485-s2/5_bins/3.npy
  transpose_msi: false
  normalization: tic

data:
  transpose_msi: false
  normalization: tic

benchmark_config: null
train_config: scripts/configs/train_parametric_mics_lmc.yaml
rank_config: scripts/configs/hd_methods_gallery.yaml

model_base:
  lr: 1.0
  lab_to_rgb: true
  number_of_points: 1000
  pca_fit_step: 4
  sampling: random
  factor: 1.0
  num_epochs: 100
  k_epoch: 20
  clusters_auto_tune_k_min: 4
  clusters_auto_tune_k_max: 128
  clusters_auto_tune_k_step: 4
  clusters_auto_tune_k_fine: 2048
  edge_stratified_grid_cells: 16
  edge_stratified_edge_floor: 0.05
  edge_stratified_uniform_mix: 0.15

tuning:
  random_state: 42
  n_iterations: 240
  n_initial_random: 8
  n_candidates: 8
  strategy: ofat_then_hill
  bayesian:
    ei_xi: 0.04
    gp_alpha: 2.0e-4
    random_explore_probability: 0.12

  fixed_params:
    num_epochs: 100
    lr: 1.0
    lab_to_rgb: true
    number_of_points: 1000
    pca_fit_step: 4
    sampling: random

  ofat_then_bayesian:
    baseline:
      temperature: 100.0
      cluster_features: raw
      cluster_ladder: "manual:8-16-32-64"
      pixel_sampling: superpixel
      beta: 20.0
      num_layers: 2
      factor: 1.0
      num_samples: 20000
      k_epoch: 20
    update_working_between_dims: true
    skip_numeric_ofat: true
    float_linspace_steps: 3
    category_max_levels: null

  hill_climbing:
    enabled: true
    after_ofat_only: true
    max_trials: 150
    relative_float_step: 0.2
    random_fallback: true

objective:
  score_mode: weighted_metrics
  square_before_continuous_dice: false
  weights:
    continuous_dice: 1.0
    luminance_rms_contrast: 1.0
    lab_chroma_entropy: 1.0
  metric_bounds:
    continuous_dice: [0.0, 1.0]
    luminance_rms_contrast: [0.0, 0.5]
    lab_chroma_entropy: [0.0, 6.0]

search_space:
  cluster_ladder:
    type: categorical
    choices:
      - "manual:8-16-32"
      - "manual:8-16-32-64"
      - "manual:8-16-32-64-2048"
      - "manual:8-32-128"
      - "manual:8-32-128-2048"
      - "manual:16-32-64-128"
      - "manual:16-32-64-128-2048"
      - "manual:32-64-128-2048"
      - "silhouette:legacy"
      - "silhouette:geo3"
      - "silhouette:geo4"
      - "silhouette:geo3_fine"
      - "silhouette:geo4_fine"
  pixel_sampling:
    type: categorical
    # miss_stratified needs two-pass bootstrap in train script; bayes study uses edge_stratified HD map only
    choices: [random, superpixel, edge_stratified]
  temperature:
    type: categorical
    choices: [1, 10.0, 100.0]
  cluster_features:
    type: categorical
    choices: [raw, pca_8, pca_32, pca_512]
  beta:
    type: categorical
    choices: [5.0, 10.0, 20.0, 40.0]
  num_layers:
    type: categorical
    choices: [1, 2, 3]
  factor:
    type: categorical
    choices: [0.5, 1.0, 2.0]
  num_samples:
    type: categorical
    choices: [5000, 20000]
  k_epoch:
    type: categorical
    choices: [1, 20, 50]

study:
  max_images: null

output:
  edge_colormap: PuBu
  equalize_mics_rgb: false

logging:
  level: INFO
