# Default configuration for MSIParametricMiCSLMC training and inference

# Mode: "train" or "inference" (or set inference.model_path to auto-detect inference mode)
mode: train

# Data configuration
data:
  input_path: "/home/jacob/Desktop/msi_data"
  transpose: false  # Whether to transpose the image

# Model hyperparameters
model:
  number_of_points: 1000
  sampling: coreset  # Options: random, kmeans++, kmeans, coreset
  num_epochs: 100
  number_of_components: 3
  lab_to_rgb: true
  cluster: true #use MiCS clustering
  clusters: 16-32-64-128
  cluster_on_pca: false  # if true, KMeans runs on PCA-reduced sampled data
  cluster_pca_dims: 50   # PCA dimensions when cluster_on_pca is true
  num_samples: 5000
  pixel_sampling: superpixel  # "superpixel" (spread over segments, slower) or "random" (fast)
  pca_fit_step: 4  # subsample step for PCA fit (X_raw[::pca_fit_step, :]); 1 = use all pixels
  beta: 1.0
  k_epoch: 20 #use for MiCS
  #k_epoch: 1 #use for LMC only
  temperature: 100.0
  lr: 1.0
  batch_size: 1024
  warmup_epochs: 10
  factor: 1.0
  random_state: 42
  verbose: false
  # Loss weights: cluster (MiCS) vs supervised (category annotations)
  cluster_loss_weight: 1.0
  category_loss_weight: 1.0


# Inference configuration
inference:
  model_path: null  # Path to trained model .pth file (for inference-only mode)
  #inference_folder: "E:\\MSImaging-data\\_msi_visual\\Extractions\\Metaspace_datasets\\Dataset4_kidney\\*.npy"  # Folder path or glob pattern for inference (e.g., "/path/to/folder/*.npy" or "/path/to/folder/")
  inference_folder: "/home/jacob/Desktop/msi_data/*.npy"
  # If inference_folder is set after training, inference will run automatically using the trained model(s)

# Default configuration for MSIParametricMiCSLMC training and inference

output_dir: null  # If null, uses outputs/ directory
save_visualizations: true
continue_on_error: false  # Continue processing other files if one fails

