mode: train
data:
  input_path: E:\MSImaging-data\_msi_visual\Extractions\KPMP
  transpose: false
model:
  model_type: mics_lmc
  unet_base_channels: 32
  dice_loss_weight: 0.001
  contrast_loss_weight: 0.001
  hd_edges_path: null
  number_of_points: 500
  simple_k: 8
  nmf_3d_max_iter: 200
  nmf_3d_n_components: 3
